<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf0">
  <meta name="description" content="Programación de festivales de cine. Horarios y películas por sala.">
  <title>¡Viva el Cine!</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=20261105-posters">
  <script type="module" src="./app.js?v=20261112-zoom"></script>
</head>
<body>
  <a class="skip-link" href="#schedule">Ir a las funciones</a>
  <header class="masthead">
    <div class="identity">
      <h1><a href="./">¡Viva el Cine!</a></h1>
      <div class="festival-bar">
        <nav id="festivals" class="festivals" aria-label="Festival"></nav>
        <p id="festival-dates"></p>
      </div>
    </div>
    <a class="source-link" id="program-source" href="./assets/programacion-sanfic22.pdf" target="_blank" rel="noopener" aria-label="Programa oficial">Programa ↗</a>
  </header>
  <main>
    <nav class="days" id="days" aria-label="Día de programación"></nav>
    <section class="schedule-shell" id="schedule" aria-labelledby="day-heading">
      <h2 class="sr-only" id="day-heading"></h2>
      <div class="toolbar">
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Buscar" aria-label="Buscar película o dirección"></label>
        <label class="select-wrap"><span class="sr-only">Sede</span><select id="venue"><option value="">Todas las sedes</option></select></label>
        <div class="zoom" role="group" aria-label="Escala de la grilla">
          <button id="zoom-out" aria-label="Reducir escala" title="Reducir escala">−</button>
          <button id="zoom-fit" aria-label="Restablecer escala" title="Restablecer escala">100%</button>
          <button id="zoom-in" aria-label="Ampliar escala" title="Ampliar escala">+</button>
        </div>
      </div>
      <div class="legend" id="legend" role="group" aria-label="Filtrar por sección"></div>
      <div class="timeline-scroll" id="timeline-scroll" tabindex="0" role="region" aria-labelledby="day-heading"><div id="timeline" class="timeline"></div></div>
      <div class="empty-results" id="empty-results" role="status" hidden>Sin resultados. <button id="reset-filters">Quitar filtros</button></div>
    </section>
    <footer class="footer">
      <div class="footer-links"><a id="festival-source" href="https://sanfic.com/esta-edicion/programacion/" target="_blank" rel="noopener">SANFIC22 ↗</a></div>
      <div class="footer-credit">
        <a id="tmdb-credit" href="https://www.themoviedb.org" target="_blank" rel="noopener"><img src="./assets/tmdb-logo.svg" width="80" height="11" alt="TMDB"></a>
        <a href="https://letterboxd.com/fel1g/" target="_blank" rel="noopener"><span class="letterboxd-dots" aria-hidden="true"></span>fel1g en Letterboxd <span aria-hidden="true">↗</span></a>
      </div>
      <p class="footer-notice" lang="en">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    </footer>
  </main>
  <dialog id="film-dialog" aria-labelledby="film-title">
    <div id="film-detail"></div>
    <form method="dialog" class="dialog-actions">
      <button type="button" id="share-screening" class="icon-button" aria-label="Compartir función" title="Compartir" aria-controls="share-menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16V3m-5 5 5-5 5 5M20 13v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"/></svg>
      </button>
      <button class="icon-button" aria-label="Cerrar detalle" title="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </form>
  </dialog>
  <div id="share-menu" class="share-menu" popover role="group" aria-label="Compartir función">
    <button id="choose-story" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>Historia de Instagram</button>
    <button id="share-link" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16V3m-5 5 5-5 5 5M20 13v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"/></svg>Compartir enlace</button>
    <button id="copy-link" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m10 13 4-4m-5 7-1 1a4.24 4.24 0 0 1-6-6l4-4a4.24 4.24 0 0 1 6 0m0 10a4.24 4.24 0 0 0 6 0l4-4a4.24 4.24 0 0 0-6-6l-1 1"/></svg><span aria-live="polite">Copiar enlace</span></button>
    <input id="share-url" class="screening-url" readonly aria-label="Enlace a esta función" hidden>
  </div>
  <dialog id="story-dialog" class="story-dialog" aria-label="Historia de Instagram">
    <form method="dialog" class="dialog-actions">
      <button class="icon-button" aria-label="Cerrar historia" title="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </form>
    <div class="story-preview" aria-busy="true">
      <img id="story-image" alt="Historia con los datos de la función" hidden>
    </div>
    <div class="story-actions">
      <button id="share-story" class="story-button primary" hidden>Compartir</button>
      <a id="download-story" class="story-button" hidden>Descargar</a>
      <button id="copy-screening" class="story-button" disabled>Copiar enlace</button>
      <button id="retry-story" class="story-button" hidden>Reintentar</button>
    </div>
    <input id="screening-url" class="screening-url" readonly aria-label="Enlace a esta función" hidden>
    <p id="story-status" role="status"></p>
  </dialog>
  <noscript><p class="noscript"><a href="./assets/programacion-sanfic22.pdf">SANFIC22</a> · <a href="https://fidocs.cl/programacion/">FIDOCS 30</a></p></noscript>
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"4b476f5a6fc540ff8db833b0f2e065b4"}'></script>
</body>
</html>
