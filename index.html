<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf0">
  <meta name="description" content="Programación de festivales de cine. Horarios y películas por sala.">
  <title>¡Viva el Cine!</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=20261104-letterboxd">
  <script type="module" src="./app.js?v=20261104-letterboxd"></script>
</head>
<body>
  <a class="skip-link" href="#schedule">Ir a las funciones</a>
  <header class="masthead">
    <div class="identity">
      <h1><a href="./">¡Viva el Cine!</a></h1>
      <div class="festival-bar">
        <nav id="festivals" class="festivals" aria-label="Festival"></nav>
        <p id="festival-dates"></p>
      </div>
    </div>
    <a class="source-link" id="program-source" href="./assets/programacion-sanfic22.pdf" target="_blank" rel="noopener">Programa oficial ↗</a>
  </header>
  <main>
    <nav class="days" id="days" aria-label="Día de programación"></nav>
    <section class="schedule-shell" id="schedule" aria-labelledby="day-heading">
      <h2 class="sr-only" id="day-heading"></h2>
      <div class="toolbar">
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Buscar película o dirección" aria-label="Buscar película o dirección"></label>
        <label class="select-wrap"><span class="sr-only">Sede</span><select id="venue"><option value="">Todas las sedes</option></select></label>
        <div class="zoom" role="group" aria-label="Escala de la grilla">
          <button id="zoom-out" aria-label="Reducir escala" title="Reducir escala">−</button>
          <button id="zoom-fit" aria-label="Restablecer escala" title="Restablecer escala">100%</button>
          <button id="zoom-in" aria-label="Ampliar escala" title="Ampliar escala">+</button>
        </div>
      </div>
      <div class="legend" id="legend" role="group" aria-label="Filtrar por sección"></div>
      <div class="timeline-scroll" id="timeline-scroll" tabindex="0" role="region" aria-labelledby="day-heading"><div id="timeline" class="timeline"></div></div>
      <div class="empty-results" id="empty-results" role="status" hidden>Sin resultados. <button id="reset-filters">Quitar filtros</button></div>
    </section>
    <footer class="footer">
      <div class="footer-links"><a id="festival-source" href="https://sanfic.com/esta-edicion/programacion/" target="_blank" rel="noopener">SANFIC22 ↗</a></div>
      <p class="footer-credit"><a href="https://letterboxd.com/fel1g/" target="_blank" rel="noopener"><span class="letterboxd-dots" aria-hidden="true"></span>fel1g en Letterboxd <span aria-hidden="true">↗</span></a></p>
    </footer>
  </main>
  <dialog id="film-dialog" aria-labelledby="film-title">
    <div id="film-detail"></div>
    <form method="dialog"><button class="close-dialog" aria-label="Cerrar detalle">×</button></form>
  </dialog>
  <noscript><p class="noscript"><a href="./assets/programacion-sanfic22.pdf">SANFIC22</a> · <a href="https://fidocs.cl/programacion/">FIDOCS 30</a></p></noscript>
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"4b476f5a6fc540ff8db833b0f2e065b4"}'></script>
</body>
</html>
